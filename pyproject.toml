[project]
name = "pcacluster"
version = "0.1.0"
description = "PCA before clustering: final project for Unsupervised Learning (UFG)"
readme = "README.md"
authors = [
    { name = "FredRelvas", email = "relvas@discente.ufg.br" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
